<!DOCTYPE html>
<html>
<head>
    <title>Menu Cleanup Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Menu Cleanup Tool</h1>
    <button onclick="clearEverything()">CLEAR ALL MENU ITEMS</button>
    <div id="output"></div>

    <script>
        // Initialize Supabase
        const supabaseUrl = 'https://dliwsryouhxretuuwkem.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsaXdzcnlvdWh4cmV0dXV3a2VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODM2NDEsImV4cCI6MjEwNDg1OTY0MX0.L3Wp2Vx274hh0ohK2KHZYPyO_WTVLonxFW4errmAq7E'
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)

        async function clearEverything() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>🧹 Starting cleanup...</p>';

            try {
                // 1. Delete all menu items from Supabase
                output.innerHTML += '<p>1. Deleting from Supabase...</p>';
                const { error } = await supabase
                    .from('menu_items')
                    .delete()
                    .gte('id', 0); // This will delete all rows
                
                if (error) {
                    output.innerHTML += `<p>❌ Supabase error: ${error.message}</p>`;
                } else {
                    output.innerHTML += '<p>✅ All items deleted from Supabase</p>';
                }

                // 2. Clear localStorage
                output.innerHTML += '<p>2. Clearing localStorage...</p>';
                localStorage.clear();
                output.innerHTML += '<p>✅ localStorage cleared</p>';

                output.innerHTML += '<p>🎉 Cleanup complete!</p>';
                output.innerHTML += '<p><strong>Now refresh your app to see changes</strong></p>';

            } catch (error) {
                output.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
